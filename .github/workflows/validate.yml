name: Validate FlowPay

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flowpay-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Validate financial, API, PWA, and Worker layers
        run: npm run validate
